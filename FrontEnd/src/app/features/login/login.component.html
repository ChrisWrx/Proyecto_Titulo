<section class="login-shell">
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>

  <article class="login-card">
    <header class="brand-block">
      <div class="brand-head">
        <figure class="brand-seal" aria-label="Logo SICHCP">
          <img src="assets/images/logo_sichcp.png" alt="Logo SICHCP" />
        </figure>

        <div class="brand-text">
          <h1>Acceso al Sistema</h1>
        </div>
      </div>
    </header>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label class="field-label" for="username">Usuario</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder="Ej: rgarciadiaz"
        [class.field-error]="usernameInvalid"
      />
      <p class="field-message" *ngIf="usernameInvalid">Ingresa tu nombre de usuario.</p>

      <label class="field-label" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="**********"
        [class.field-error]="passwordInvalid"
      />
      <p class="field-message" *ngIf="passwordInvalid">La contraseña es obligatoria.</p>

      <button class="login-button" type="submit" [disabled]="loading()">
        <span *ngIf="!loading()">Entrar al sistema</span>
        <span *ngIf="loading()">Validando acceso...</span>
      </button>
    </form>

    <p class="feedback error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
    <p class="feedback success" *ngIf="successMessage()">{{ successMessage() }}</p>
  </article>
</section>
