services:
  postgres:
    image: postgres:18
    container_name: sichcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sichcp}
      POSTGRES_USER: ${POSTGRES_USER:-sichcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia-esta-clave}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init/01-BD_SICHCP_postgresql_20260920_145100.sql:/docker-entrypoint-initdb.d/01-BD_SICHCP.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: